backend:
  name: github
  repo: anasalkhateeb08-jpg/infoprods
  branch: main
media_folder: "public/images/uploads"
public_folder: "/images/uploads"
collections:
  # Blog Posts Collection
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Description", name: "description", widget: "string", required: true}
      - {label: "Author", name: "author", widget: "string", default: "InfoProds Team"}
      - {label: "Publish Date", name: "date", widget: "datetime", required: true}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Category", name: "category", widget: "select", required: true, options: ["Beauty","Car Accessories & Care", "Sports & Sport Info", "Fitness & Health", "Home", "Jewelry", "Kitchen", "Miscellaneous", "Technology & Devices"]}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown", required: true}
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - {label: "Question", name: "question", widget: "string"}
          - {label: "Answer", name: "answer", widget: "text"}
      - label: "How-To Schema"
        name: "howToName"
        widget: "string"
        required: false
      - label: "How-To Description"
        name: "howToDescription"
        widget: "text"
        required: false
      - label: "How-To Time"
        name: "howToTime"
        widget: "string"
        required: false
      - label: "How-To Steps"
        name: "howToSteps"
        widget: "list"
        required: false
        fields:
          - {label: "Step Name", name: "name", widget: "string"}
          - {label: "Step Text", name: "text", widget: "text"}
      - label: "Product Schema"
        name: "productName"
        widget: "string"
        required: false
      - label: "Product Description"
        name: "productDescription"
        widget: "text"
        required: false
      - label: "Product Image"
        name: "productImage"
        widget: "image"
        required: false
      - label: "Product Brand"
        name: "productBrand"
        widget: "string"
        required: false
      - label: "Product Rating"
        name: "productRating"
        widget: "object"
        required: false
        fields:
          - {label: "Rating Value", name: "ratingValue", widget: "number"}
          - {label: "Review Count", name: "reviewCount", widget: "number"}
      - label: "Product Offers"
        name: "productOffers"
        widget: "object"
        required: false
        fields:
          - {label: "Price", name: "price", widget: "string"}
          - {label: "Currency", name: "priceCurrency", widget: "string", default: "USD"}